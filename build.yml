name: Build Little Pages APK

on:
  push:
    paths:
      - 'little-pages-android-source.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip Little Pages source
        shell: bash
        run: |
          test -f little-pages-android-source.zip || { echo 'Missing little-pages-android-source.zip at repository root'; exit 1; }
          mkdir -p extracted
          unzip -q little-pages-android-source.zip -d extracted
          test -f extracted/little-pages/settings.gradle.kts || { echo 'Expected little-pages/settings.gradle.kts inside ZIP'; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # GitHub's Ubuntu 24.04 runner already has Android SDK 35 and Build Tools 35.
      # Avoid android-actions/setup-android, which failed during SDK setup previously.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo 'Android SDK 35 missing'; exit 1; }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo 'Android Build Tools 35 missing'; exit 1; }

      - name: Build debug APK
        working-directory: extracted/little-pages
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: little-pages-debug-apk
          path: extracted/little-pages/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
